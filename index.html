<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Myshell.ai - Obsidian Platinum</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              mono: ['Courier New', 'monospace'],
            },
            colors: {
              obsidian: '#1a1a1a',
              platinum: '#e5e7eb',
              granite: '#4b5563',
            },
            animation: {
              'float-slow': 'float 12s ease-in-out infinite',
              'orb-move': 'orb 25s linear infinite',
              'scanline': 'scanline 10s linear infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-15px)' },
              },
              orb: {
                '0%': { transform: 'translate(0, 0)' },
                '33%': { transform: 'translate(5vw, 10vh)' },
                '66%': { transform: 'translate(-5vw, 5vh)' },
                '100%': { transform: 'translate(0, 0)' },
              },
              scanline: {
                '0%': { transform: 'translateY(-100%)' },
                '100%': { transform: 'translateY(100%)' },
              }
            }
          },
        },
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
      body {
        background: #f8fafc;
        min-height: 100vh;
        overflow-x: hidden;
        color: #1a1a1a;
      }
      
      .industrial-glass {
        background: rgba(255, 255, 255, 0.4);
        backdrop-filter: blur(40px) saturate(150%);
        border: 1px solid rgba(0, 0, 0, 0.1);
        box-shadow: 
          0 15px 35px rgba(0, 0, 0, 0.05),
          inset 0 0 0 1px rgba(255, 255, 255, 0.7);
      }

      .obsidian-title-bar {
        background: linear-gradient(180deg, #333 0%, #000 100%);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
      }

      .bevel-win98-light {
        box-shadow: 
          inset 1px 1px 0 rgba(255,255,255,0.9),
          inset -1px -1px 0 rgba(0,0,0,0.1);
      }

      .bg-orb-industrial {
        position: fixed;
        border-radius: 50%;
        filter: blur(120px);
        z-index: -1;
        opacity: 0.15;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>
  <body>
    <!-- Monochrome Background orbs -->
    <div class="bg-orb-industrial w-[800px] h-[800px] bg-slate-400 top-[-300px] left-[-200px] animate-orb-move"></div>
    <div class="bg-orb-industrial w-[600px] h-[600px] bg-slate-300 bottom-[-100px] right-[-100px] animate-orb-move" style="animation-delay: -7s"></div>
    
    <div id="root"></div>
  </body>
</html>
